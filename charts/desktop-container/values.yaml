fullnameOverride: ""

image:
  # Registry image by default. For a local, never-pulled image (built with
  # podman and imported into the node's runtime), set repository to the
  # imported name and pullPolicy to Never.
  repository: desktop-container
  tag: latest
  pullPolicy: IfNotPresent

gpu:
  # When true, the pod requests NVIDIA GPU injection as an extended
  # resource. Requires on the node: NVIDIA driver, /etc/cdi/nvidia.yaml
  # (generated by install.sh --host-prep-only), CDI support in CRI-O, and
  # a device plugin advertising resourceName below.
  enabled: false
  # Resource the pod requests for the GPU. The default is what NVIDIA's own
  # k8s-device-plugin advertises, so on a normal GPU node this just works.
  # Without that plugin, serve the CDI spec with charts/cdi-device-plugin
  # and point this at whatever resource name you gave it:
  #   helm install gpu-cdi charts/cdi-device-plugin \
  #       --set cdiDevice=nvidia.com/gpu=all --set resourceName=desktop.local/gpu
  #
  # NOTE: this replaced a cdi.k8s.io/gpu pod annotation, which never worked
  # -- kubelet builds a container's CRI annotations from device-plugin
  # output only, so a pod-spec annotation never reaches the runtime's CDI
  # injection. A device plugin is the only supported route.
  resourceName: nvidia.com/gpu
  # Exported as NVIDIA_DRIVER_CAPABILITIES.
  driverCapabilities: all

hostPaths:
  # Host udev database (read-only): device enumeration + seat tags.
  udev: /run/udev
  # Exported X socket dir: host/other containers use DISPLAY=:0.
  x11Socket: /tmp/.X11-unix
  # Exported audio sockets (PipeWire native + Pulse).
  audioSocket: /run/desktop-audio
  # Client toolkit the desktop publishes for client containers; the
  # desktop.local/tools CDI device mounts it into them read-only. Disk-backed
  # rather than /run because the toolkit grows and tmpfs costs RAM per tool.
  toolsBin: /var/lib/desktop-container/bin
  # Host-shell material (ssh key + username) for the 'Host Terminal' menu
  # entry; created by install.sh --shell-user, harmless when empty.
  hostShellDir: /etc/desktop-container

# Privileged initContainer that chmods the exported socket dirs to 1777
# (hostPath DirectoryOrCreate creates them 0755 root, which would block the
# in-container desktop user from creating sockets).
initPerms:
  enabled: true

# Grace period for systemd to shut the session down cleanly after the
# image's STOPSIGNAL (SIGRTMIN+3).
terminationGracePeriodSeconds: 60

# Ready only when a real X connection succeeds (xdpyinfo handshake).
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10

# Off by default: systemd + the in-container Restart=always on the session
# already handle recovery; a liveness kill would reboot the whole desktop.
livenessProbe:
  enabled: false
  initialDelaySeconds: 60
  periodSeconds: 30

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
