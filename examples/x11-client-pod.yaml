# Demo client for the desktop: opens xterm on the containerized display and
# can also play sound. Reuses the desktop image because it already has X
# clients installed; any image with an X11 app works the same way -- the
# only thing that makes the desktop reachable is the resource requests
# below.
#
#   kubectl apply -f examples/x11-client-pod.yaml
#
# The two resources are separate capabilities, and you should request only
# what you need:
#
#   desktop.local/display   DISPLAY + the X socket
#   desktop.local/audio     PULSE_SERVER/PIPEWIRE_REMOTE + the audio sockets
#
# Drop the audio line for a GUI app that makes no sound: audio includes
# RECORDING, so it hands over the microphone. Drop the display line for a
# sound-only workload: X11 here lets any client keylog and screenshot the
# whole session.
#
# Requesting a resource makes kubelet call cdi-device-plugin, which names
# the matching CDI device; CRI-O then applies that device's containerEdits
# to this pod. Nothing else in this manifest mentions mounts or env.
#
# (A pod annotation cannot do this: kubelet builds a container's CRI
# annotations from device-plugin output only, never from the pod spec.)
#
# Audio from a client, once the audio resource is requested:
#   paplay /usr/share/sounds/alsa/Front_Center.wav   # via injected PULSE_SERVER
#   pw-play ...                                      # via injected PIPEWIRE_REMOTE
# (ALSA-only apps additionally need alsa-plugins-pulseaudio + an asound.conf
# routing pcm.!default to the pulse socket -- see README.)
apiVersion: v1
kind: Pod
metadata:
  name: x11-client-demo
spec:
  restartPolicy: Never
  containers:
    - name: xterm
      image: desktop-container:latest
      # :latest defaults the pull policy to Always, which tries a registry
      # pull even when the image is already present on the node.
      imagePullPolicy: IfNotPresent
      command: ["xterm", "-geometry", "80x24+200+200", "-title", "CDI demo"]
      resources:
        limits:
          desktop.local/display: 1
          desktop.local/audio: 1
