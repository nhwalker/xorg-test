# Bound the container's own journal, in RAM.
#
# This container has no /var/log/journal, so journald picks volatile storage
# and writes to /run/log/journal - which is a tmpfs, so the journal is RAM.
# Left to itself journald caps volatile storage at 10% of that tmpfs, and the
# tmpfs is sized from the host's memory: on a 64 GB workstation "10%" is
# hundreds of megabytes of RAM the desktop can quietly grow into and never
# give back, on a machine meant to run for months.
#
# So state the number rather than inheriting a percentage of whatever the host
# happens to have. Storage=volatile is also stated explicitly rather than left
# to auto: "auto" becomes PERSISTENT the moment something creates
# /var/log/journal, which would put the journal on the container's writable
# layer, where it survives nothing and is invisible to `podman logs`.
#
# This is the RAM half of the logging bound. The other half is the host-side
# podman log that journal-console.service streams into - see LogDriver= and
# --log-opt max-size in the quadlet
# (deploy/host/etc/containers/systemd/desktop.container). Both are asserted by
# verify-log-bounds in the e2e.
[Journal]
Storage=volatile
RuntimeMaxUse=64M
