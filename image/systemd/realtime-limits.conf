# RLIMIT_RTPRIO/RLIMIT_MEMLOCK for everything systemd starts in this container.
#
# The quadlet sets --ulimit rtprio=95 --ulimit memlock=..., which reaches the
# container's PID 1 - and stops there. systemd does NOT pass its own rlimits
# through to the units it spawns: it applies DefaultLimit*= instead, and the
# default for RTPRIO is 0. So PipeWire, which runs under user@1000.service,
# saw a hard limit of 0 no matter what the quadlet asked for.
#
# The visible symptom named rtkit, not rlimits:
#
#   dbus-broker-launch: Activation request for 'org.freedesktop.RealtimeKit1'
#                       failed: The systemd unit 'rtkit-daemon.service' is masked
#   pipewire: mod.rt: RTKit does not give us MaxRealtimePriority, using 1
#
# PipeWire's module-rt only falls back to RTKit when it cannot get realtime
# scheduling directly, and it could not, because of this. rtkit being masked is
# deliberate (it needs SYS_PTRACE/DAC_READ_SEARCH/NET_ADMIN - see the mask in
# Containerfile); this drop-in is the other half of that decision, and without
# it masking rtkit silently costs the audio stack its priorities.
#
# Raising the limit needs CAP_SYS_RESOURCE, which the quadlet grants.
# Installed into BOTH system.conf.d and user.conf.d: the first covers
# user@1000.service itself, the second the user units inside it.
# NICE=31 is what `nice.level = -11` needs (RLIMIT_NICE is expressed as
# 20 - the nice value). module-rt only warns when it cannot lower nice, but
# there is no reason to leave that failing once the RT half is being fixed.
[Manager]
DefaultLimitRTPRIO=95
DefaultLimitMEMLOCK=67108864
DefaultLimitNICE=31
