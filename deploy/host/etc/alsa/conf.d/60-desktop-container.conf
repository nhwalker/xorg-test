# Part of the desktop-container deploy tree (deploy/README.md).
# Route ALSA clients on the host through the pulse plugin to the
# containerized desktop's PipeWire - raw hw access would fight the
# container's PipeWire for the devices. Requires alsa-plugins-pulseaudio.
#
# A drop-in rather than /etc/asound.conf: alsa.conf.d loads before
# /etc/asound.conf, so this never clobbers a host-local asound.conf and a
# host that has one still overrides the deploy tree. The /etc/alsa/conf.d mechanism is EL/Fedora packaging;
# other distros may need the same two stanzas in /etc/asound.conf instead.
pcm.!default {
    type pulse
    server "unix:/run/desktop-audio/pulse"
}
ctl.!default {
    type pulse
    server "unix:/run/desktop-audio/pulse"
}
