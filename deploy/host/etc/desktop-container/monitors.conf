# Fixed monitor layout for the desktop container.
#
# Ships EMPTY (every line below is a comment) = feature off: Xorg autodetects
# from EDID exactly as it always did. Uncomment and describe your monitors to
# turn it on. The container re-reads this at every start of desktop.service;
# nothing on the host needs reloading.
#
# WHY: a KVM switch takes the video link with it. On switch-away the monitor's
# EDID disappears and the GPU sees the connector go down; on switch-back
# nothing re-establishes the outputs, because the session's window manager
# (mwm) predates RandR and no desktop environment is running to react. The
# screen collapses onto whatever survived and every window is reflowed into
# it. Declaring the layout here removes the question: Xorg is told what the
# geometry is, so it never asks a connector.
#
# Use it on any host whose display arrangement is known at provisioning time -
# which, for a KVM'd desk, it is.
#
# ---------------------------------------------------------------------------
# OUTPUT LINES - one per monitor, in the order does not matter:
#
#   <output>  <WIDTHxHEIGHT[@Hz]>  <+X+Y>  [primary] [rotate=left|right|inverted]
#
#   output   the RandR output name, exactly as the X server spells it
#            (DP-1, HDMI-2, DVI-D-1 on modesetting; DP-0, HDMI-0 on NVIDIA).
#            Capture the running arrangement instead of guessing:
#                desktop-monitors-capture
#            prints a ready-to-paste block for the monitors attached now.
#   WxH@Hz   the mode. The refresh defaults to 60 and may be fractional
#            (59.94). On the modesetting driver the container derives a
#            standard CVT timing for it - the panel's own EDID timing is
#            deliberately NOT used, so that the mode is the same whether the
#            monitor is there to describe itself or not. It appears in
#            `xrandr` under the cvt(1) name, e.g. "1920x1080_60.00". On
#            NVIDIA the driver picks the timing and the refresh here is
#            advisory.
#   +X+Y     top-left corner in the framebuffer, xrandr's spelling. The
#            framebuffer is pinned to the extents of everything declared.
#   primary  at most one; sets the RandR primary output.
#   rotate=  applied by the CRTC, so a rotated panel occupies its transposed
#            size in the layout.
#
# Two 1080p monitors side by side, left one primary:
#
#   DP-1    1920x1080@60   +0+0       primary
#   DP-2    1920x1080@60   +1920+0
#
# A 4K centre screen with a portrait panel to its right:
#
#   DP-1    3840x2160@60   +0+0       primary
#   HDMI-1  1080x1920@60   +3840+0    rotate=left
#
# ---------------------------------------------------------------------------
# GLOBAL LINES - all optional:
#
#   watch 2
#       How often (seconds) the session re-asserts the layout if the live one
#       drifts from it - the backstop for a driver that drops a CRTC on
#       switch-away. Default 2. "watch off" leaves only the boot-time config,
#       which is also what to set if anything in the session is expected to
#       run xrandr for itself: the loop will otherwise undo it.
#
#   virtual 3840x1080
#       Override the computed framebuffer size. Only useful to leave room for
#       an output that is not declared yet; it may not be smaller than the
#       declared layout.
#
#   nvidia-connected DFP-0,DFP-1
#       NVIDIA ONLY, and the one thing that cannot be derived. The NVIDIA
#       driver has no equivalent of the per-output "always enabled" flag used
#       on modesetting; ConnectedMonitor is it. The names are the driver's
#       DISPLAY DEVICE names, which are not the RandR output names above -
#       read them off `nvidia-settings -q dpys` or the Xorg log
#       ("Connected display device(s)"). Set this if the layout survives a
#       KVM switch on a modesetting host but not on the NVIDIA one.
#
#   nvidia-edid DFP-0=/etc/desktop-container/edid-dfp0.bin
#       NVIDIA ONLY, repeatable. Hands the driver a saved EDID for a display
#       device, so mode validation is unchanged when the real one is away.
#       Capture it while the monitor is attached:
#           cat /sys/class/drm/card1-DP-1/edid > /etc/desktop-container/edid-dfp0.bin
#       The path is the one INSIDE the container; /etc/desktop-container is
#       mounted there read-only, so anything dropped beside this file works.
