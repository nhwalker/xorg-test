# Part of the desktop-container deploy tree (deploy/README.md).
# Shared socket dirs the quadlet bind-mounts into the container: created at
# boot before the desktop starts, world-writable + sticky like classic
# /tmp/.X11-unix. Tighten /run/desktop-audio here if world-connectable audio
# sockets matter on your host (README "Security notes").
d /run/desktop-audio 1777 root root -
d /tmp/.X11-unix 1777 root root -
# /dev/snd must EXIST for the quadlet's Volume=/dev/snd:/dev/snd to resolve.
# It is a bind mount rather than an AddDevice= because AddDevice is a
# creation-time snapshot and a USB sound card plugged in later would never
# appear inside the container (same reasoning as /dev/input).
#
# The catch that makes this line necessary: podman REFUSES to create a
# container whose bind source is missing ("statfs /dev/snd: no such file or
# directory") - it does not create the source, and there is no optional
# marker for Volume= the way AddDevice= has its '-' prefix. A host with no
# sound hardware has no /dev/snd, and such a host must still boot the
# desktop so that the container's preflight can say what is missing. So the
# directory is created here, unconditionally and empty; on a host that does
# have sound, udev has already populated it and this is a no-op.
#
# 0755 root root, matching what the kernel's own /dev/snd looks like. Not
# 1777 like the two socket dirs above: nothing unprivileged creates entries
# here - udev does.
d /dev/snd 0755 root root -
# Client toolkit: the binaries the desktop publishes for client containers,
# mounted into them by the desktop.local/tools CDI device.
#
# 0755, NOT the 1777 the two socket dirs above use. Those are world-writable
# because an unprivileged session process has to create sockets in them. This
# one holds EXECUTABLES that get mounted into every client, so anything able to
# write here would control code running in all of them; only the desktop
# container (as root) writes it. Do not "make it consistent" with its
# neighbours.
#
# Disk-backed rather than /run: the toolkit is expected to grow, and each Go
# binary carries its own ~1.4MB runtime, so on tmpfs every new tool would cost
# that again in RAM. Unlike /run it survives reboots, so a teardown has to
# remove it explicitly.
d /var/lib/desktop-container 0755 root root -
d /var/lib/desktop-container/bin 0755 root root -
# Host Terminal: home for the sysusers.d-created desktop-shell account
# (sysusers never creates homes) and the root-owned authorized_keys
# location the sshd drop-in points at. Runs after systemd-sysusers, so the
# user reference resolves.
d /home/desktop-shell 0700 desktop-shell desktop-shell -
d /etc/ssh/authorized_keys.d 0755 root root -
# Host home for the desktop session account (sysusers never creates homes).
# Nothing runs from it - the session lead is a sleep - but PAM and systemd
# want the passwd home to exist. The container has its own /home/desktop on
# its own filesystem; the two never meet.
d /home/desktop 0700 desktop desktop -
