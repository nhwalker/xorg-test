# Part of the desktop-container deploy tree (deploy/README.md).
# Adds a root-owned per-user authorized_keys location so the desktop-shell
# trust anchor lives outside any home directory (the account cannot edit
# its own trust). Both paths are listed because sshd honors only the FIRST
# AuthorizedKeysFile directive it parses, and sshd_config.d is included
# before the main config's own setting - dropping the stock path here
# would break key logins for every other user.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
