# Part of the desktop-container deploy tree (deploy/README.md).
# The containerized Xorg owns the VT; host logind must not spawn gettys on
# VT switches or reserve a VT for itself. Host logind keeps running (ssh
# logins etc. still work); with no graphical session it holds no DRM master
# and no input devices.
[Login]
NAutoVTs=0
ReserveVT=0
