# Part of the desktop-container deploy tree (deploy/README.md).
# Dedicated account the desktop's "Host Terminal" lands in via loopback
# ssh. Deliberately boring and unprivileged: a normal login shell, no
# groups, no sudo. This is NOT a security boundary and is not meant to be:
# the desktop container is a trusted component (host pid namespace, host
# network) regardless of what this account can do (see "Container
# privileges" in README.md). The account exists for convenience
# and an audit trail. Trust is
# root-owned: the only authorized key is written fresh each boot to
# /etc/ssh/authorized_keys.d/desktop-shell, so the account cannot extend
# its own access.
u desktop-shell - "Containerized desktop host shell" /home/desktop-shell /bin/bash

# The desktop session account, on host and container alike. The host's
# desktop-session.service opens a real PAM/logind login session as this
# user (seat0, tty1, utmp, the /run/user runtime dir), and the container's
# session processes run as the same uid - one identity, bookkept where
# seats live. The uid is FIXED and deliberately far from the ordinary user
# range: uid 1000 belongs to the host's first real user on most installs
# (the e2e VM's login user among them), and in the host pid namespace a
# shared uid is a shared signaling and file-access domain. 61000 must match
# the useradd in the image's Containerfile - the two are one contract.
u desktop 61000 "Containerized desktop session" /home/desktop /usr/sbin/nologin
