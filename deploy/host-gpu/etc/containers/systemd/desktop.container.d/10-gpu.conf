# desktop-container deploy tree, GPU host overlay (deploy/README.md).
# Inject the NVIDIA GPU - devices plus driver userspace - via the CDI spec,
# and regenerate that spec before every desktop start so a host driver
# update never leaves it stale (stale spec = container creation fails).
#
# Applying this overlay is a per-host-class provisioning decision; there is
# no runtime autodetection like install.sh's. On a host without the NVIDIA
# driver + container toolkit, AddDevice= makes desktop.service fail - only
# deploy it where the GPU is actually present.
#
# Older nvidia container toolkits omit the Xorg driver module from the CDI
# spec; the container then falls back to modesetting and preflight FAILs the
# nvidia coherence check. Fix: pin a toolkit that includes nvidia_drv.so, or
# bind-mount the host's copies by appending here:
#   Volume=/usr/lib64/xorg/modules/drivers/nvidia_drv.so:/usr/lib64/xorg/modules/drivers/nvidia_drv.so:ro
#   Volume=/usr/lib64/xorg/modules/extensions/libglxserver_nvidia.so:/usr/lib64/xorg/modules/extensions/libglxserver_nvidia.so:ro

[Unit]
Wants=desktop-cdi-refresh.service
After=desktop-cdi-refresh.service

[Container]
AddDevice=nvidia.com/gpu=all
Environment=NVIDIA_DRIVER_CAPABILITIES=all
