# desktop-container deploy tree, host-shell overlay (deploy/README.md).
# Provision the loopback-ssh key material for the "Host Terminal" menu entry
# before the desktop starts. The target account is per-host configuration,
# NOT part of this tree: provisioning must write the account name to
#   /etc/desktop-container/shell-user
# (a single line, e.g. "alice"). Without that file the setup unit skips
# itself and the menu entry degrades gracefully, like the rest of the
# feature (README "Host terminal from the desktop").

[Unit]
Wants=desktop-host-shell.service
After=desktop-host-shell.service
