# A lean, non-desktop client (see Containerfile.testclient) that carries the
# CDI annotation and declares NOTHING else - no env, no volumeMounts - so the
# display + audio it can reach come only from the CDI spec's containerEdits.
# Proves the contract holds for an ordinary app image, not just the desktop one.
apiVersion: v1
kind: Pod
metadata:
  name: x11-testclient
  annotations:
    cdi.k8s.io/display: "desktop.local/display=all"
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: localhost/desktop-testclient:latest
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
