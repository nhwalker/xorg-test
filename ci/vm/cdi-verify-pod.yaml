# Proof-by-construction pod for the desktop CDI device (test-only).
#
# It carries the cdi.k8s.io annotation and declares NOTHING else: no env, no
# volumeMounts, no volumes. So at runtime, every one of DISPLAY /
# PULSE_SERVER / PIPEWIRE_REMOTE and the /tmp/.X11-unix + /run/desktop-audio
# sockets is present ONLY because CRI-O applied the containerEdits from
# /etc/cdi/desktop.yaml. vm-guest.sh verify-cdi asserts exactly that, then
# plays a beep through each audio client path from inside this pod.
#
# sleep infinity keeps it alive so the host can exec assertions and timed
# playbacks into it.
apiVersion: v1
kind: Pod
metadata:
  name: cdi-verify
  annotations:
    cdi.k8s.io/display: "desktop.local/display=all"
spec:
  restartPolicy: Never
  containers:
    - name: verify
      image: localhost/desktop-container:latest
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
