# Proof-by-construction pod for the desktop CDI device (test-only).
#
# It requests BOTH capabilities and declares NOTHING else: no env, no
# volumeMounts, no volumes. So at runtime, every one of DISPLAY /
# PULSE_SERVER / PIPEWIRE_REMOTE and the /tmp/.X11-unix + /run/desktop-audio
# sockets is present ONLY because the device plugins named the CDI devices
# and CRI-O applied the containerEdits from /etc/cdi/desktop-display.yaml
# and /etc/cdi/desktop-audio.yaml. vm-guest.sh verify-cdi asserts exactly
# that, then plays a beep through each audio client path from inside this
# pod.
#
# The narrow pods next to this one (display-only, audio-only) prove the two
# devices grant only their own half.
#
# sleep infinity keeps it alive so the host can exec assertions and timed
# playbacks into it.
apiVersion: v1
kind: Pod
metadata:
  name: cdi-verify
spec:
  restartPolicy: Never
  containers:
    - name: verify
      image: localhost/desktop-container:latest
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        limits:
          desktop.local/display: 1
          desktop.local/audio: 1
