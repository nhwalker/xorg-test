# Tiers 1-3: static checks, image builds (offline gate + GHCR base cache),
# and the boot-smoke suite driven by the declarative deploy/ tree.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Runnable on a branch without opening a PR. e2e-vm has had this all along;
  # ci did not, so everything in it - including the quadlet dry-run - could
  # only be exercised through a PR. That is part of why a dry-run assertion
  # that had stopped being able to fail sat here undetected: there was no
  # cheap way to run it against a work-in-progress branch and read the output.
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cdi-device-plugin/go.mod
          cache-dependency-path: |
            cdi-device-plugin/go.sum
            screenshot/go.sum
      # Both modules pin the same go/toolchain directives, so one setup-go
      # serves them; if they ever diverge this needs a second setup step.
      - name: go fmt/vet/test (cdi-device-plugin)
        working-directory: cdi-device-plugin
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: go fmt/vet/test (screenshot)
        working-directory: screenshot
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: shellcheck (error severity)
        # No apt install: the runner image ships shellcheck (0.9.0 on
        # ubuntu-24.04). Installing it anyway cost this job its entire
        # 20-minute budget twice when an apt mirror stalled, for a binary
        # that was already on the box. If a future image drops it, the
        # invocation below fails with command-not-found, which says so.
        run: |
          shellcheck --version
          shellcheck -S error ci/*.sh ci/vm/*.sh \
            image/xorg/*.sh image/session/host-shell-setup.sh \
            image/session/start-session image/session/session-postmortem \
            image/session/host-terminal image/tools/publish-tools.sh \
            deploy/host/usr/local/libexec/desktop-cdi-refresh \
            deploy/host/usr/local/libexec/desktop-client-cdi \
            deploy/host/usr/local/libexec/desktop-tools-cdi \
            deploy/host/usr/local/libexec/desktop-host-shell-setup \
            deploy/host/usr/local/libexec/desktop-selinux \
            deploy/host/usr/local/libexec/seat-prep.sh \
            deploy/host/usr/local/bin/desktop-preflight \
            deploy/host/usr/local/bin/desktop-monitors-capture
      - name: fixed monitor layout branch tests
        # Pure logic (no root, no X, no container): the boot-time generator's
        # driver paths and rejections, and the derived CVT timings against the
        # values cvt(1) prints. A wrong Modeline is a black screen on the host
        # that opted in, and nothing downstream would catch it - the config it
        # lands in is syntactically perfect either way.
        run: ci/monitor-layout-tests.sh
      - name: build args stay global (multi-stage ARG scoping)
        # An ARG declared before the first FROM is global and usable in every
        # FROM line; one declared AFTER a FROM belongs to that stage alone and
        # expands to nothing later. Containerfile has two stages and two args,
        # and getting this wrong fails with "no FROM statement found" - which
        # names neither the arg nor the line. hadolint does not catch it, so
        # the rule is enforced here rather than trusted to review.
        run: |
          python3 - <<'PY'
          import glob, sys
          bad = []
          for f in sorted(glob.glob('Containerfile*')):
              lines = [l.strip() for l in open(f)
                       if l.strip() and not l.lstrip().startswith('#')]
              froms = [i for i, l in enumerate(lines) if l.upper().startswith('FROM')]
              if not froms:
                  continue
              for i, l in enumerate(lines):
                  if l.upper().startswith('ARG') and i > froms[0]:
                      bad.append(f"{f}: {l!r} is declared after the first FROM, "
                                 "so it is scoped to that stage and will be empty "
                                 "in later FROM lines")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all Containerfile ARGs precede the first FROM")
          PY
      - name: helm lint + template assertions
        run: |
          helm lint charts/cdi-device-plugin --set cdiDevice=desktop.local/display=all
          ci/helm-assertions.sh
      - name: kubeconform (k8s schema validation)
        # The client manifests are plain YAML (a resource request, no
        # chart), so they are validated directly, not via helm template.
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template p charts/cdi-device-plugin --set cdiDevice=desktop.local/display=all \
            | ./kubeconform -strict -summary
          ./kubeconform -strict -summary \
            examples/x11-client-pod.yaml ci/vm/cdi-verify-pod.yaml \
            ci/vm/testclient-pod.yaml ci/vm/display-only-pod.yaml ci/vm/audio-only-pod.yaml \
            ci/vm/testpattern-pod.yaml

  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (skipped on fork PRs)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        # --password-stdin, never -p: an argument would put the token in the
        # process list and in podman's own error output on a failed login.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: base images (content-addressed GHCR cache)
        env:
          PUSH_BASES: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
        run: sudo -E ci/build-bases.sh
      - name: application layers (offline gate)
        run: |
          # --network=none is the offline gate, not a speed-up: these layers
          # must build with no network at all, so a dependency can never be
          # added without also changing a Containerfile.*.base and forcing a
          # base rebuild. A build that needs the network fails here loudly
          # instead of drifting.
          #
          # Before the desktop image: that layer stages the client tools out of
          # this one (Containerfile's `tools` build stage).
          sudo podman build --network=none -t localhost/screenshot:latest -f Containerfile.screenshot .
          sudo podman build --network=none -t localhost/desktop-container:latest -f Containerfile .
          sudo podman build --network=none -t localhost/cdi-device-plugin:latest -f Containerfile.plugin .
      - name: deploy tree quadlet dry-run + CDI spec checks
        # Validate the declarative deploy/ tree: the quadlet generator must
        # accept the unit, and everything must land in the generated service
        # on ANY podman version - all features live in the base unit
        # precisely because pre-5.0 quadlet silently ignores drop-in dirs.
        # Then the stub CDI spec written by desktop-cdi-refresh on this
        # GPU-less runner must actually satisfy AddDevice=nvidia.com/gpu=all
        # at container creation, the client specs written by
        # desktop-client-cdi must inject display and audio SEPARATELY into
        # unrelated containers (each device granting only its own half, with
        # a no-device control), and the host-shell converger must produce a
        # working sysusers account + root-owned trust file.
        run: |
          tmp=$(mktemp -d)
          install -m644 deploy/host/etc/containers/systemd/desktop.container "$tmp/"
          # the quadlet generator's install dir varies by packaging
          # (libexec vs lib vs /usr/local); search rather than assume
          q=""
          for c in /usr/libexec/podman/quadlet /usr/lib/podman/quadlet \
                   /usr/lib64/podman/quadlet /usr/local/libexec/podman/quadlet \
                   /usr/local/lib/podman/quadlet; do
            [ -x "$c" ] && { q=$c; break; }
          done
          [ -n "$q" ] || q=$(sudo find /usr -type f -name quadlet 2>/dev/null | head -n1)
          [ -n "$q" ] || { echo "podman quadlet generator not found on runner"; podman --version; exit 1; }
          echo "using quadlet generator: $q"
          out=$(QUADLET_UNIT_DIRS="$tmp" "$q" -dryrun -no-kmsg-log)
          echo "--- generated unit ---"; echo "$out"; echo "--- end ---"
          # Assert against the GENERATED ExecStart, not against "anywhere in
          # the output". Anywhere-in-the-output is how the old
          # `grep -q -- --privileged` here survived the privilege reduction
          # still passing: the .container source mentions --privileged only in
          # comments now, and the check could not tell a comment from a flag.
          # An assertion that cannot fail when the behaviour reverses is worse
          # than no assertion, because it reads as coverage.
          exec_line=$(echo "$out" | grep -m1 '^ExecStart=')
          [ -n "$exec_line" ] || { echo "no ExecStart= in generated unit"; exit 1; }
          echo "$exec_line" | grep -q -- '--privileged' \
            && { echo "the generated unit is --privileged; the reduction regressed"; exit 1; }
          # Patterns accept "--flag=value" or "--flag value": quadlet chooses
          # the spelling and it is not worth a red build to guess which.
          # The privilege reduction, as it reaches podman.
          echo "$exec_line" | grep -qi -- '--cap-drop[= ]all'
          echo "$exec_line" | grep -q  -- '--security-opt[= ]label=disable'
          # The log bound, both halves (see the logging block in the unit).
          echo "$exec_line" | grep -q  -- '--log-driver[= ]k8s-file'
          echo "$exec_line" | grep -q  -- '--log-opt[= ]max-size=64m'
          echo "$exec_line" | grep -q  -- '--device[= ]nvidia.com/gpu=all'
          # Unit directives, asserted as DIRECTIVES rather than as strings that
          # appear somewhere. Every one of these also exists verbatim in the
          # source .container, and quadlet copies the source's comments into
          # its output - so an unanchored grep cannot distinguish "quadlet
          # emitted this directive" from "this text is present somewhere". The
          # ^ anchor excludes comment lines, which always begin with #.
          #
          # The value patterns allow other entries on the same line, because
          # quadlet is free to merge several Wants= into one.
          have() {
            echo "$out" | grep -qE "^$1" \
              || { echo "generated unit is missing directive: $1"; exit 1; }
          }
          have 'WantedBy=multi-user\.target'
          have 'Conflicts=.*getty@tty1\.service'
          have 'Conflicts=.*display-manager\.service'
          have 'Wants=.*desktop-seat-prep\.service'
          have 'Wants=.*desktop-cdi-refresh\.service'
          have 'Wants=.*desktop-client-cdi\.service'
          have 'Wants=.*desktop-host-shell\.service'
          # GPU-less runner: the converger must write the stub, and podman
          # must resolve AddDevice against it end-to-end.
          sudo deploy/host/usr/local/libexec/desktop-cdi-refresh
          sudo grep -q NVIDIA_CDI_STUB /etc/cdi/nvidia.yaml
          sudo podman run --rm --device nvidia.com/gpu=all \
            localhost/desktop-container:latest sh -c 'test "$NVIDIA_CDI_STUB" = 1'
          # Client CDI specs: the whole sharing mechanism, checked against a
          # real runtime rather than by reading YAML. Each device must grant
          # its own capability and ONLY its own -- the split is a property of
          # running containers here, not of two YAML files.
          sudo install -d -m1777 /tmp/.X11-unix /run/desktop-audio
          sudo deploy/host/usr/local/libexec/desktop-client-cdi
          # display alone: DISPLAY + X socket dir, and NO audio whatsoever.
          sudo podman run --rm --device desktop.local/display=all \
            localhost/desktop-container:latest sh -c '
              test "$DISPLAY" = :0 || { echo "DISPLAY=$DISPLAY"; exit 1; }
              grep -q " /tmp/.X11-unix " /proc/self/mountinfo || exit 1
              ! printenv PULSE_SERVER || { echo "leaked PULSE_SERVER"; exit 1; }
              ! printenv PIPEWIRE_REMOTE || { echo "leaked PIPEWIRE_REMOTE"; exit 1; }
              ! grep -q " /run/desktop-audio " /proc/self/mountinfo || { echo "leaked audio mount"; exit 1; }'
          # audio alone: both audio env vars + the audio dir, and NO display.
          sudo podman run --rm --device desktop.local/audio=all \
            localhost/desktop-container:latest sh -c '
              test "$PULSE_SERVER" = unix:/run/desktop-audio/pulse || exit 1
              test "$PIPEWIRE_REMOTE" = /run/desktop-audio/pipewire-0 || exit 1
              grep -q " /run/desktop-audio " /proc/self/mountinfo || exit 1
              ! printenv DISPLAY || { echo "leaked DISPLAY"; exit 1; }
              ! grep -q " /tmp/.X11-unix " /proc/self/mountinfo || { echo "leaked X11 mount"; exit 1; }'
          # both together: the union, which is what a full desktop client asks for.
          sudo podman run --rm --device desktop.local/display=all --device desktop.local/audio=all \
            localhost/desktop-container:latest sh -c '
              test "$DISPLAY" = :0 || exit 1
              test "$PULSE_SERVER" = unix:/run/desktop-audio/pulse || exit 1
              grep -q " /tmp/.X11-unix " /proc/self/mountinfo || exit 1
              grep -q " /run/desktop-audio " /proc/self/mountinfo || exit 1'
          # ...and a container WITHOUT any device gets none of it, so the
          # checks above cannot pass on something baked into the image.
          sudo podman run --rm localhost/desktop-container:latest sh -c '
              ! printenv DISPLAY || exit 1
              ! printenv PULSE_SERVER || exit 1
              ! grep -q " /tmp/.X11-unix " /proc/self/mountinfo || exit 1'
          # The DISPLAY override is the one input clients cannot discover
          # for themselves; a silently ignored conf would be a live break.
          sudo install -d /etc/desktop-container
          echo 'DISPLAY_VALUE=:7' | sudo tee /etc/desktop-container/client-cdi.conf >/dev/null
          sudo deploy/host/usr/local/libexec/desktop-client-cdi
          sudo podman run --rm --device desktop.local/display=all \
            localhost/desktop-container:latest sh -c 'test "$DISPLAY" = :7'
          sudo rm -f /etc/desktop-container/client-cdi.conf
          sudo deploy/host/usr/local/libexec/desktop-client-cdi
          # seat-prep: converges the runner's seat state and must be
          # idempotent (second run silent, exit 0)
          sudo deploy/host/usr/local/libexec/seat-prep.sh
          [ "$(sudo systemctl is-enabled getty@tty1.service || true)" = masked ]
          [ "$(systemctl get-default)" = multi-user.target ]
          second=$(sudo deploy/host/usr/local/libexec/seat-prep.sh | grep -v 'fuser not available' || true)
          [ -z "$second" ]
          # host-shell: sysusers account, fresh key, root-owned restricted trust
          sudo systemd-sysusers "$PWD/deploy/host/etc/sysusers.d/desktop-container.conf"
          sudo install -Dm644 deploy/host/etc/desktop-container/shell-user /etc/desktop-container/shell-user
          sudo deploy/host/usr/local/libexec/desktop-host-shell-setup
          sudo grep -q 'from="127.0.0.1,::1".*desktop-container-host-shell' \
            /etc/ssh/authorized_keys.d/desktop-shell
          # host-preflight (debug tool): must run to completion and correctly
          # report this partially-applied runner - quadlet not installed
          # (FAIL) but the pieces the step applied green (stub CDI spec,
          # desktop-shell account, seat state)
          pf=$(sudo deploy/host/usr/local/bin/desktop-preflight || true)
          echo "$pf"
          echo "$pf" | grep -q 'done: [0-9]* FAIL'
          echo "$pf" | grep -q 'FAIL: quadlet unit missing'
          echo "$pf" | grep -q 'PASS: GPU-less host: stub CDI spec'
          echo "$pf" | grep -q 'PASS: desktop-shell account exists'
          echo "$pf" | grep -q 'PASS: default target is multi-user.target'

      - name: neutralize host AppArmor unix-chkpwd profile
        # Ubuntu's path-attached unix-chkpwd profile confines the CONTAINER's
        # EL9 unix_chkpwd on exec (dac_read_search denied), breaking every
        # PAM account phase inside the container. Runner-only interference;
        # RHEL-family hosts have no AppArmor.
        run: sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd 2>/dev/null || true
      - name: deploy-tree boot smoke (end to end on the ephemeral runner)
        # Apply the deploy/ tree with the documented rsync, boot
        # desktop.service from its quadlet, and verify the full composition
        # (converger oneshots, stub CDI through a real systemd start,
        # desktop-shell ssh both directions, desktop-preflight fully green).
        # Also runs the root-only branch tests for the CDI converger and a
        # dirty-seat seat-prep scenario.
        run: sudo -E ci/smoke-deploy.sh
      - name: collect diagnostics on failure
        if: failure()
        run: |
          sudo podman ps -a || true
          sudo podman logs desktop 2>&1 | tail -100 || true
          sudo journalctl -u desktop.service --no-pager | tail -50 || true
