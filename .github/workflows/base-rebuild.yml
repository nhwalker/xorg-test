# Weekly from-scratch rebuild of the base image: early warning for
# Rocky/UBI point-release drift (dnf conflicts fail this loudly before
# anyone needs a base rebuild), and keeps the GHCR :latest base fresh
# with security updates. Every run keeps S1.1.2's evidence: the build logs
# and the week's package drift in the desktop base.
name: base-rebuild
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the rebuilt bases to GHCR (content tag and latest). Off, the run rebuilds and keeps its evidence and leaves the registry as it is."
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login
        # --password-stdin, never -p: an argument would put the token in the
        # process list and in podman's own error output on a failed login.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: rebuild the bases from scratch, then the app layers offline on them (S1.1.2)
        # ci/base-rebuild.sh: --pull --no-cache for the three bases, then
        # --network=none for the three app layers (the offline gate), each
        # build's log kept, and rpm -qa of the desktop base GHCR held before
        # this run diffed against the fresh one's.
        env:
          EV_ROOT: ${{ github.workspace }}/artifacts
          EV_SOURCE: "base-rebuild.yml (ci/base-rebuild.sh)"
        run: ci/base-rebuild.sh
      - name: the evidence is complete
        if: always()
        run: python3 ci/evlib.py check artifacts
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-base-rebuild
          path: artifacts/
          if-no-files-found: ignore
      - name: push refreshed bases (content tag + latest)
        # Every scheduled run pushes; a manual run only when asked to.
        if: github.event_name == 'schedule' || inputs.push
        env:
          PUSH_BASES: "1"
        run: |
          set -euo pipefail
          tag() { sha256sum "$@" | sha256sum | cut -c1-16; }
          for spec in \
            "desktop-container-base Containerfile.base image/rocky9.repo" \
            "cdi-device-plugin-base Containerfile.plugin.base cdi-device-plugin/go.mod cdi-device-plugin/go.sum" \
            "screenshot-base Containerfile.screenshot.base screenshot/go.mod screenshot/go.sum"; do
            set -- $spec
            name=$1; shift
            t="base-$(tag "$@")"
            sudo podman tag "localhost/$name:latest" "$REGISTRY/$name:$t"
            sudo podman tag "localhost/$name:latest" "$REGISTRY/$name:latest"
            sudo podman push "$REGISTRY/$name:$t"
            sudo podman push "$REGISTRY/$name:latest"
          done
