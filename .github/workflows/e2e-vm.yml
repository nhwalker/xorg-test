# Tiers 4-5: full-stack e2e in a KVM-accelerated Rocky 9 VM with virtio
# graphics/input/sound and SELinux enforcing - the declarative deploy/ tree
# applied to a stock host (real Xorg, audio, input hotplug, root-owned
# desktop-shell trust under enforcing, preflight green), then k3s + a
# cdi-device-plugin release per capability with confined client pods wired
# up by CDI, all while the quadlet desktop keeps serving the display.
# SELinux stays enforcing for BOTH phases - nothing here calls setenforce.
name: e2e-vm
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  vm-e2e:
    runs-on: ubuntu-latest
    # Normal run is ~7 min; keep headroom for a cold Rocky image download
    # but fail fast on a hang rather than sitting for the old 90 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: enable kvm access
        run: |
          test -e /dev/kvm || { echo "no /dev/kvm on runner"; exit 1; }
          sudo chmod 666 /dev/kvm
      - name: install qemu + tools
        # These are genuinely not on the runner image, so apt is required.
        # Retries + a transfer timeout because a stalled mirror otherwise
        # hangs with no output until the job's 30-minute cap kills it: with
        # these, apt gives up on the bad mirror in 30s and retries, and a
        # real outage fails fast with a message instead of a blank timeout.
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS update -q
          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS install -y -q qemu-system-x86 qemu-utils cloud-image-utils socat imagemagick
      - name: cache rocky cloud image
        id: rocky
        uses: actions/cache@v4
        with:
          path: ci/vm/Rocky-9-GenericCloud.qcow2
          key: rocky9-genericcloud-v1
      - name: download rocky cloud image
        if: steps.rocky.outputs.cache-hit != 'true'
        run: |
          curl -fL -o ci/vm/Rocky-9-GenericCloud.qcow2 \
            https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
      - name: ghcr login (base cache; skipped on fork PRs)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build images (reuse GHCR bases when possible)
        env:
          PUSH_BASES: "0"
        run: |
          sudo -E ci/build-bases.sh
          # Before the desktop image: that layer stages the client tools out of
          # this one (Containerfile's `tools` build stage).
          sudo podman build --network=none -t localhost/screenshot:latest -f Containerfile.screenshot .
          sudo podman build --network=none -t localhost/desktop-container:latest -f Containerfile .
          sudo podman build --network=none -t localhost/cdi-device-plugin:latest -f Containerfile.plugin .
          # Lean non-desktop client fixture (networked build; CI-only, not a
          # product artifact, so the offline rule does not apply to it). Must
          # come AFTER the screenshot build: it pulls the binary out of that
          # image with COPY --from.
          sudo podman build -t localhost/desktop-testclient:latest -f Containerfile.testclient .
          # One archive per image: podman-save's docker-archive format
          # silently collapses multiple images into the FIRST one with all
          # tags attached (the plugin tag would end up naming the desktop
          # image).
          sudo podman save -o ci/vm/images-desktop.tar localhost/desktop-container:latest
          sudo podman save -o ci/vm/images-plugin.tar localhost/cdi-device-plugin:latest
          sudo podman save -o ci/vm/images-testclient.tar localhost/desktop-testclient:latest
          sudo chmod 644 ci/vm/images-desktop.tar ci/vm/images-plugin.tar ci/vm/images-testclient.tar
      - name: run VM e2e
        run: ci/vm/vm-e2e.sh
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-e2e-artifacts
          path: ci/vm/artifacts/
          if-no-files-found: ignore
